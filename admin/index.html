<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Glimp admin</title>
<link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400,100&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<script>try { var t = localStorage.getItem("glimp-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>

<!-- Sign in -->
<main class="login" data-view="login" hidden>
  <form class="login-card" data-login>
    <img src="../assets/brand/glimp-wordmark-on-light.svg" alt="Glimp" class="login-logo light-only" width="140">
    <img src="../assets/brand/glimp-wordmark-on-dark.svg" alt="Glimp" class="login-logo dark-only" width="140">
    <label>Email<input name="email" type="email" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit">Sign in</button>
    <p class="msg" data-login-msg hidden></p>
  </form>
</main>

<!-- App -->
<div class="app" data-view="app" hidden>
  <header class="top">
    <a href="../" class="brand"><img src="../assets/brand/glimp-mark-on-light.svg" alt="Glimp" class="light-only" height="26"><img src="../assets/brand/glimp-mark-on-dark.svg" alt="" class="dark-only" height="26"></a>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
      <button role="tab" data-tab="orders">Orders <b class="pill" data-tocall hidden></b></button>
      <button role="tab" data-tab="stock">Stock</button>
      <button role="tab" data-tab="behaviour">Behaviour</button>
    </nav>
    <div class="top-r">
      <select data-range aria-label="Date range">
        <option value="0">Today</option>
        <option value="1">Yesterday</option>
        <option value="7" selected>Last 7 days</option>
        <option value="30">Last 30 days</option>
        <option value="90">Last 90 days</option>
      </select>
      <button class="link" data-signout>Sign out</button>
    </div>
  </header>

  <section class="pane" data-pane="overview"></section>
  <section class="pane" data-pane="orders" hidden>
    <div class="o-acts bulk"><button class="btn sm" data-new-order>New order</button></div>
    <form class="card new-order" data-new-form hidden>
      <h3>New order</h3>
      <div class="ship-form">
        <label class="fld"><span class="label">Name</span><input name="name" required autocomplete="off"></label>
        <label class="fld"><span class="label">Phone</span><input name="phone" required inputmode="tel" maxlength="14"></label>
        <label class="fld"><span class="label">Email</span><input name="email" type="email" placeholder="optional"></label>
        <label class="fld wide"><span class="label">Address</span><input name="address" required minlength="8"></label>
        <label class="fld"><span class="label">PIN</span><input name="pincode" required inputmode="numeric" pattern="[1-9][0-9]{5}" maxlength="6"></label>
        <label class="fld"><span class="label">City</span><input name="city" required></label>
        <label class="fld"><span class="label">State</span><select name="state" required><option value="">Choose</option><option>Andaman and Nicobar Islands</option><option>Andhra Pradesh</option><option>Arunachal Pradesh</option><option>Assam</option><option>Bihar</option><option>Chandigarh</option><option>Chhattisgarh</option><option>Dadra and Nagar Haveli and Daman and Diu</option><option>Delhi</option><option>Goa</option><option>Gujarat</option><option>Haryana</option><option>Himachal Pradesh</option><option>Jammu and Kashmir</option><option>Jharkhand</option><option>Karnataka</option><option>Kerala</option><option>Ladakh</option><option>Lakshadweep</option><option>Madhya Pradesh</option><option>Maharashtra</option><option>Manipur</option><option>Meghalaya</option><option>Mizoram</option><option>Nagaland</option><option>Odisha</option><option>Puducherry</option><option>Punjab</option><option>Rajasthan</option><option>Sikkim</option><option>Tamil Nadu</option><option>Telangana</option><option>Tripura</option><option>Uttar Pradesh</option><option>Uttarakhand</option><option>West Bengal</option></select></label>
        <label class="fld"><span class="label">Colour</span><select name="colour" required><option value="">Choose</option><option value="white">White</option><option value="red">Red</option><option value="yellow">Yellow</option><option value="teal">Teal</option><option value="grey">Grey</option></select></label>
        <label class="fld"><span class="label">Qty</span><input name="qty" type="number" min="1" max="5" value="1" required></label>
        <label class="fld"><span class="label">Price ₹ each</span><input name="price" type="number" min="0" step="1" value="1690" required></label>
        <label class="fld"><span class="label">Payment</span><select name="payment"><option value="cod">COD</option><option value="prepaid">Prepaid</option></select></label>
        <label class="fld"><span class="label">From</span><select name="channel"><option value="whatsapp">WhatsApp</option><option value="instagram">Instagram</option><option value="phone">Phone</option><option value="offline">In person</option><option value="other">Other</option></select></label>
        <label class="fld wide"><span class="label">Note</span><input name="note" placeholder="optional"></label>
        <label class="fld"><span class="label">AWB</span><input name="awb" placeholder="optional"></label>
        <label class="fld"><span class="label">Courier</span><input name="courier" placeholder="optional"></label>
        <div class="o-acts ship-btns"><button class="btn sm">Add order</button><button class="btn sm ghost" type="button" data-new-close>Close</button></div>
      </div>
    </form>
    <div class="chips" data-order-filter>
      <button data-f="created" aria-pressed="true">To call</button>
      <button data-f="confirmed">To ship</button>
      <button data-f="shipped">Shipped</button>
      <button data-f="delivered">Delivered</button>
      <button data-f="cancelled">Cancelled</button>
      <button data-f="rto">RTO</button>
      <button data-f="">All</button>
    </div>
    <div data-orders></div>
  </section>
  <section class="pane" data-pane="stock" hidden></section>
  <section class="pane" data-pane="behaviour" hidden></section>

  <p class="foot">Times in IST · Test orders and your own visits are left out of every number · <a href="?glimp_internal=1" data-internal>Mark this device as internal</a></p>
</div>

<div class="toast" data-toast role="status" hidden></div>
<script src="admin.js"></script>
</body>
</html>
