<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Glimp admin</title>
<link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400,100&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<script>try { var t = localStorage.getItem("glimp-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>

<!-- Sign in -->
<main class="login" data-view="login" hidden>
  <form class="login-card" data-login>
    <img src="../assets/brand/glimp-wordmark-on-light.svg" alt="Glimp" class="login-logo light-only" width="140">
    <img src="../assets/brand/glimp-wordmark-on-dark.svg" alt="Glimp" class="login-logo dark-only" width="140">
    <label>Email<input name="email" type="email" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit">Sign in</button>
    <p class="msg" data-login-msg hidden></p>
  </form>
</main>

<!-- App -->
<div class="app" data-view="app" hidden>
  <header class="top">
    <a href="../" class="brand"><img src="../assets/brand/glimp-mark-on-light.svg" alt="Glimp" class="light-only" height="26"><img src="../assets/brand/glimp-mark-on-dark.svg" alt="" class="dark-only" height="26"></a>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
      <button role="tab" data-tab="orders">Orders <b class="pill" data-tocall hidden></b></button>
      <button role="tab" data-tab="stock">Stock</button>
      <button role="tab" data-tab="behaviour">Behaviour</button>
    </nav>
    <div class="top-r">
      <select data-range aria-label="Date range">
        <option value="0">Today</option>
        <option value="1">Yesterday</option>
        <option value="7" selected>Last 7 days</option>
        <option value="30">Last 30 days</option>
        <option value="90">Last 90 days</option>
      </select>
      <button class="link" data-signout>Sign out</button>
    </div>
  </header>

  <section class="pane" data-pane="overview"></section>
  <section class="pane" data-pane="orders" hidden>
    <div class="chips" data-order-filter>
      <button data-f="created" aria-pressed="true">To call</button>
      <button data-f="confirmed">To ship</button>
      <button data-f="shipped">Shipped</button>
      <button data-f="delivered">Delivered</button>
      <button data-f="cancelled">Cancelled</button>
      <button data-f="rto">RTO</button>
      <button data-f="">All</button>
    </div>
    <div data-orders></div>
  </section>
  <section class="pane" data-pane="stock" hidden></section>
  <section class="pane" data-pane="behaviour" hidden></section>

  <p class="foot">Times in IST · Test orders and your own visits are left out of every number · <a href="?glimp_internal=1" data-internal>Mark this device as internal</a></p>
</div>

<div class="toast" data-toast role="status" hidden></div>
<script src="admin.js"></script>
</body>
</html>
